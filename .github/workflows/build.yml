name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

#permissions:
#  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: 'maven'

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -v

      - name: Build (skip tests)
        run: mvn -B -ntp -DskipTests -Psbom install

      # Uncomment to run unit tests instead of skipping
      # - name: Build and run tests
      #   run: mvn -B -ntp verify

      - name: Archive build artifacts (optional)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            **/target/*.war
            **/target/*.ear
          if-no-files-found: ignore

      # The EDS container image is built from the uber-jar produced above. EDS
      # does not ship a database container, it uses an existing PostgreSQL
      - name: Build EDS container image
        run: docker build -f accessories/docker/Dockerfile.quarkus -t eds-quarkus:ci .

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      # The container SBOM covers the operating system packages and the Java
      # runtime of the image, in addition to the libraries in the uber-jar
      - name: Generate container SBOM
        id: container-sbom
        run: |
          ${{ steps.syft.outputs.cmd }} scan eds-quarkus:ci \
              -o cyclonedx-json=target/container-eds-quarkus-cyclonedx.json

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v6

      # Scans the aggregated SBOM, and fails the build if any vulnerability
      # with severity High or Critical is found. Findings which have been
      # reviewed and found not to apply, can be suppressed in .grype.yaml
      - name: Scan SBOM for vulnerabilities
        run: |
          sbom=$(ls target/eds-*-cyclonedx.json)
          ${{ steps.grype.outputs.cmd }} "sbom:${sbom}" \
              --fail-on high \
              -o table \
              -o json=grype-report.json

      # The EDS image fails the build on High or Critical findings, like the
      # Maven SBOM
      - name: Scan container SBOM for vulnerabilities
        if: ${{ !cancelled() && steps.container-sbom.outcome == 'success' }}
        run: |
          ${{ steps.grype.outputs.cmd }} sbom:target/container-eds-quarkus-cyclonedx.json \
              --fail-on high \
              -o table \
              -o json=grype-report-eds-container.json

      - name: Upload vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-report*.json
          if-no-files-found: ignore

      - name: Upload SBOMs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            target/*-cyclonedx.json
            target/*-cyclonedx.xml
          if-no-files-found: ignore

  dependency-updates:
    name: Verify dependency and plugin updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: 'maven'

      - name: Generate dependency and plugin update report
        run: |
          echo "===== Parent Updates =====" > dependency-updates.txt
          mvn -B -ntp versions:display-parent-updates -DallowSnapshots=false 2>&1 | tee -a dependency-updates.txt
          echo "" >> dependency-updates.txt
          echo "===== Dependency Updates =====" >> dependency-updates.txt
          mvn -B -ntp versions:display-dependency-updates -DallowSnapshots=false 2>&1 | tee -a dependency-updates.txt
          echo "" >> dependency-updates.txt
          echo "===== Plugin Updates =====" >> dependency-updates.txt
          mvn -B -ntp versions:display-plugin-updates -DallowSnapshots=false 2>&1 | tee -a dependency-updates.txt

      - name: Show update summary
        run: |
          echo "===== Dependency/Plugin Update Report ====="
          cat dependency-updates.txt

      - name: Upload update report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-report
          path: dependency-updates.txt
          if-no-files-found: warn
