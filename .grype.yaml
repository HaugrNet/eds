# Grype configuration, used by the vulnerability scan in the CI Build.
#
# Vulnerabilities which have been reviewed and found not to affect EDS can be
# suppressed here. Every entry must have a comment explaining why it does not
# apply, so the decision can be re-evaluated later. Example:
#
# ignore:
#   # EDS never calls the affected API, see <link to analysis>
#   - vulnerability: CVE-2025-12345
#     package:
#       name: some-library
#       version: 1.2.3
ignore:
  # Quadratic CPU use when parsing the W3C tracestate header. The API comes
  # only through quarkus-scheduler (opentelemetry-instrumentation-api); EDS
  # has no OpenTelemetry extension, so no propagator ever parses an incoming
  # tracestate header. Fixed in 1.67.0: remove this entry once the Quarkus
  # BOM manages that version or later (3.40.1.2 still has 1.62.0).
  - vulnerability: GHSA-ccrj-gw8r-854m
    package:
      name: opentelemetry-api
      version: 1.62.0
