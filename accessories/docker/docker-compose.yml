# ==============================================================================
# Docker Compose setup for EDS (Encrypted Data Share)
# ------------------------------------------------------------------------------
# Runs the EDS Quarkus application as a single container. EDS does not ship a
# database container. The database is selected at startup:
#   * EDS_DB_URL set: an existing PostgreSQL database is used. The database,
#     user and password must exist; EDS creates the tables if they are
#     missing.
#   * EDS_DB_URL not set: the in-memory H2 database is used, and all data is
#     lost when the container stops. Intended for tests and evaluation.
# See RUNNING.md for details.
#
# Usage:
#   For PostgreSQL, create a .env file next to this file, with:
#     EDS_DB_URL=jdbc:postgresql://host.docker.internal:5432/eds
#     EDS_DB_PASSWORD=...
#   Build the Quarkus JAR first: mvn -pl eds-quarkus -am clean package -DskipTests
#   Then run: docker compose up -d
#
# Inside the container, "localhost" is the container itself. For a PostgreSQL
# running on the Docker host, use "host.docker.internal" (mapped below), and
# make sure PostgreSQL accepts connections from the Docker network.
# ==============================================================================

services:
  eds-app:
    build:
      context: ../..
      dockerfile: accessories/docker/Dockerfile.quarkus
    container_name: eds-quarkus
    environment:
      # Empty EDS_DB_URL means the in-memory H2 database
      EDS_DB_URL: ${EDS_DB_URL:-}
      EDS_DB_USERNAME: ${EDS_DB_USERNAME:-eds_user}
      EDS_DB_PASSWORD: ${EDS_DB_PASSWORD:-}
      QUARKUS_LOG_FILE_ENABLED: true
      QUARKUS_LOG_FILE_PATH: /app/logs/eds.log
      QUARKUS_LOG_FILE_ROTATION_MAX_FILE_SIZE: 10M
      QUARKUS_LOG_FILE_ROTATION_MAX_BACKUP_INDEX: 5
      TZ: Europe/Berlin
      # TLS: set EDS_TLS_CERT and EDS_TLS_KEY to paths inside /app/certs/
      EDS_TLS_CERT: ${EDS_TLS_CERT:-}
      EDS_TLS_KEY: ${EDS_TLS_KEY:-}
      EDS_INSECURE_REQUESTS: ${EDS_INSECURE_REQUESTS:-enabled}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./volumes/logs:/app/logs
      - ${EDS_CERTS_DIR:-/dev/null}:/app/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    # Management port (health endpoints), container network only; do not
    # publish it under "ports".
    expose:
      - "9000"
