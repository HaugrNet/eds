# ==============================================================================
# Docker Compose setup for EDS (Encrypted Data Share)
# ------------------------------------------------------------------------------
# This setup creates two containers:
# - PostgreSQL database with persistent storage
# - Quarkus application running the EDS service
#
# Usage:
#   Copy .env.example to .env and fill in the required values before starting.
#   Build the Quarkus JAR first: mvn -pl eds-quarkus -am clean package -DskipTests
#   Then run: docker compose up -d
# ==============================================================================

services:
  # PostgreSQL Database
  eds-db:
    image: postgres:16-alpine
    container_name: eds-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      EDS_DB_USERNAME: ${EDS_DB_USERNAME:-eds_user}
      EDS_DB_PASSWORD: ${EDS_DB_PASSWORD:?EDS_DB_PASSWORD must be set in .env}
      EDS_DB_NAME: ${EDS_DB_NAME:-eds}
      TZ: Europe/Berlin
    volumes:
      - ./volumes/data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ../release/postgresql/02-init.sql:/docker-entrypoint-initdb.d/sql/02-init.sql:ro
      - ../release/postgresql/03-create.sql:/docker-entrypoint-initdb.d/sql/03-create.sql:ro
      - ../release/postgresql/04-update-1.sql:/docker-entrypoint-initdb.d/sql/04-update-1.sql:ro
      - ../release/postgresql/04-update-2.sql:/docker-entrypoint-initdb.d/sql/04-update-2.sql:ro
      - ../release/postgresql/04-update-3.sql:/docker-entrypoint-initdb.d/sql/04-update-3.sql:ro
    networks:
      - eds-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$EDS_DB_USERNAME\" -d \"$$EDS_DB_NAME\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Quarkus Application
  eds-app:
    build:
      context: ../..
      dockerfile: accessories/docker/Dockerfile.quarkus
    container_name: eds-quarkus
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://eds-db:5432/${EDS_DB_NAME:-eds}
      QUARKUS_DATASOURCE_USERNAME: ${EDS_DB_USERNAME:-eds_user}
      QUARKUS_DATASOURCE_PASSWORD: ${EDS_DB_PASSWORD:?EDS_DB_PASSWORD must be set in .env}
      QUARKUS_LOG_FILE_ENABLED: true
      QUARKUS_LOG_FILE_PATH: /app/logs/eds.log
      QUARKUS_LOG_FILE_ROTATION_MAX_FILE_SIZE: 10M
      QUARKUS_LOG_FILE_ROTATION_MAX_BACKUP_INDEX: 5
      TZ: Europe/Berlin
      # TLS: set EDS_TLS_CERT and EDS_TLS_KEY to paths inside /app/certs/
      EDS_TLS_CERT: ${EDS_TLS_CERT:-}
      EDS_TLS_KEY: ${EDS_TLS_KEY:-}
      EDS_INSECURE_REQUESTS: ${EDS_INSECURE_REQUESTS:-enabled}
    volumes:
      - ./volumes/logs:/app/logs
      - ${EDS_CERTS_DIR:-/dev/null}:/app/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - eds-network
    depends_on:
      eds-db:
        condition: service_healthy

# Internal network for container communication
networks:
  eds-network:
    driver: bridge
