# PostgreSQL Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/${EDS_DB_NAME:eds}
quarkus.datasource.username=${EDS_DB_USERNAME:eds_user}
quarkus.datasource.password=${EDS_DB_PASSWORD}

# TLS — set EDS_TLS_CERT and EDS_TLS_KEY to enable HTTPS.
# When set, HTTP requests are redirected to HTTPS (port 8443).
# Generate a cert: openssl req -x509 -newkey rsa:4096 -keyout tls.key -out tls.crt -days 365 -nodes
quarkus.http.ssl.certificate.files=${EDS_TLS_CERT:}
quarkus.http.ssl.certificate.key-files=${EDS_TLS_KEY:}
quarkus.http.insecure-requests=${EDS_INSECURE_REQUESTS:enabled}
quarkus.http.ssl-port=8443

# Package as uber-jar for deployment
quarkus.package.jar.type=uber-jar
quarkus.package.output-name=eds-runnable
quarkus.package.jar.add-runner-suffix=false
