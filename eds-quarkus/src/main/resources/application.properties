# ==============================================================================
# EDS on Quarkus, with the database selected at startup
# ------------------------------------------------------------------------------
# Both databases are configured, but only one is active at runtime:
#   * PostgreSQL ("pg"), if a database URL is configured, via the environment
#     variable EDS_DB_URL or the system property eds.db.url.
#   * H2 in-memory ("h2") otherwise. All data is lost when EDS stops.
# The selection is made by net.haugr.eds.quarkus.DatabaseSelection, which
# sets the "active" flags below. A configured but unreachable PostgreSQL is
# never replaced by H2; EDS then stays not ready, and retries.
# ==============================================================================

# HTTP
quarkus.http.port=8080
quarkus.http.root-path=/eds

# Ensure Quarkus indexes the EDS core module, so CDI and JAX-RS annotations
# are discovered
quarkus.index-dependency.eds-core.group-id=net.haugr
quarkus.index-dependency.eds-core.artifact-id=eds-core

# Scheduler, used by the Sanitizer and the database retry
quarkus.scheduler.enabled=true

# Dev Services are never used; in test mode they would otherwise try to start
# a PostgreSQL container for the inactive datasource.
quarkus.devservices.enabled=false

# If the database cannot be reached at startup, EDS stays not ready, and
# retries with this interval until it is reachable (see DatabaseStartup).
eds.db.retry-interval=${EDS_DB_RETRY_INTERVAL:10s}

# PostgreSQL, the jdbc.url is set from EDS_DB_URL by DatabaseSelection
quarkus.datasource.pg.db-kind=postgresql
quarkus.datasource.pg.username=${EDS_DB_USERNAME:eds_user}
quarkus.datasource.pg.password=${EDS_DB_PASSWORD:}

# H2 in-memory. The schema is created by the StartupBean, not via an INIT
# script in the URL, as H2 runs INIT for every new pooled connection.
quarkus.datasource.h2.db-kind=h2
quarkus.datasource.h2.db-version=2.3.232
quarkus.datasource.h2.jdbc.url=jdbc:h2:mem:eds;DB_CLOSE_DELAY=-1
quarkus.datasource.h2.username=sa
quarkus.datasource.h2.password=

# One persistence unit per database, both with the same EDS entities
quarkus.hibernate-orm.pg.datasource=pg
quarkus.hibernate-orm.pg.packages=net.haugr.eds.core.model.entities
quarkus.hibernate-orm.pg.schema-management.strategy=none
quarkus.hibernate-orm.pg.log.sql=false
quarkus.hibernate-orm.h2.datasource=h2
quarkus.hibernate-orm.h2.packages=net.haugr.eds.core.model.entities
quarkus.hibernate-orm.h2.schema-management.strategy=none
quarkus.hibernate-orm.h2.log.sql=false

# TLS, set EDS_TLS_CERT and EDS_TLS_KEY to enable HTTPS.
quarkus.http.ssl.certificate.files=${EDS_TLS_CERT:}
quarkus.http.ssl.certificate.key-files=${EDS_TLS_KEY:}
quarkus.http.insecure-requests=${EDS_INSECURE_REQUESTS:enabled}
quarkus.http.ssl-port=8443

# Management interface, serves the health endpoints on a separate plain-HTTP
# port, so the probes keep working when the application port is TLS-only, and
# the health details stay off the public port. Expose this port only to the
# orchestrator. Build-time setting; cannot be changed at runtime.
quarkus.management.enabled=true
quarkus.management.port=9000

# Package as uber-jar for deployment
quarkus.package.jar.type=uber-jar
quarkus.package.output-name=eds-runnable
quarkus.package.jar.add-runner-suffix=false
