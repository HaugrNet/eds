# ==============================================================================
# Rune, the PWA (RUNE.md)
# ------------------------------------------------------------------------------
# Only part of the EDS with Rune (the Maven profile rune of eds-quarkus), not
# of the stone alone (-Dstone), which has neither Rune nor Quinoa. The other
# settings are in src/main/resources/application.properties.
# ==============================================================================

# The PWA (RUNE.md), built by Quinoa from src/main/webui with a pinned
# Node, which Quinoa downloads itself. It is served at the root (/), with the
# REST paths below /api/v1; it has no routes, so no SPA fallback is needed and
# nothing falls back over the API. In dev mode, Quinoa proxies to the Vite dev
# server.
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.0
quarkus.quinoa.dev-server.port=5173
# Quinoa is off in tests by default; EdsPwaTest checks the served app.
%test.quarkus.quinoa=true
